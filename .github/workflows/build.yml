name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Comprobación estática: no construye nada, tarda segundos.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis de scripts y bloques RUN
        run: bash scripts/check-syntax.sh

  # Imagen OCI + `bootc container lint`.
  #
  # NVIDIA queda desactivado: akmods necesita compilar contra el kernel de la
  # imagen y eso multiplica el tiempo de CI. La imagen de release se construye
  # en local con WITH_NVIDIA=true (por defecto).
  image:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Instalar Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs

      - name: Construir la imagen
        run: |
          sudo podman build \
            --build-arg WITH_NVIDIA=false \
            --build-arg FEDORA_VERSION=44 \
            -t zenith:ci .

      - name: bootc container lint
        run: sudo podman run --rm --entrypoint bootc zenith:ci container lint

      - name: Verificar el escritorio dentro de la imagen
        run: |
          sudo env PODMAN=podman IMAGE=zenith:ci WITH_NVIDIA=false \
            bash scripts/verify-image.sh zenith:ci

      - name: Calcular nombre de la imagen
        run: |
          # ghcr.io rechaza mayúsculas en el nombre del repositorio (el propietario
          # de GitHub puede tenerlas: WwwNoOne), así que se normaliza a minúsculas.
          imagen="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/zenith-linux"
          echo "IMAGE=$imagen" >> "$GITHUB_ENV"
          echo "Imagen de destino: $imagen"

      - name: Iniciar sesión en ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publicar la imagen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sudo podman tag zenith:ci "$IMAGE:latest"
          sudo podman push "$IMAGE:latest"
          echo "Imagen publicada: $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "Para instalarla: bootc switch $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
