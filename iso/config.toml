# Zenith Linux — configuración de bootc-image-builder
#
# Se aplica a ISO, VMDK, QCOW2 y RAW. Para una ISO "de verdad" conviene
# cambiar la contraseña de prueba antes de construirla.

[customizations]
# El hostname no se configura aquí: la biblioteca de imágenes lo rechaza para
# qcow2/vmdk ("customizations.hostname: not supported"). La imagen ya trae
# /etc/hostname = zenith y el instalador lo sobrescribe si el usuario lo cambia.

# Usuario de prueba. CAMBIAR la contraseña o eliminarlo en producción.
[[customizations.user]]
name = "zenith"
password = "zenith"
groups = ["wheel"]
